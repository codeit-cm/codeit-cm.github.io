<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>불시점검 안내 멘트</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f7f5;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.2rem; }
h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
.card {
  background: #fff;
  border: 1px solid #e5e5e3;
  border-radius: 12px;
  padding: 1.25rem 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: #6b6b6b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-sub { font-size: 12px; color: #aaa; margin-top: -6px; }

/* ── 과정 프로필 칩 ── */
.profile-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1.5px dashed #d9d9d6;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  color: #555;
  transition: border-color .15s, background .15s;
}
.profile-chip:hover { border-color: #8b7cf8; color: #6c4ef2; background: #f9f8ff; }
.profile-chip.active { background: #8b7cf8; border-color: #8b7cf8; color: #fff; font-weight: 600; }
.profile-chip .del-x { font-size: 11px; opacity: 0.5; margin-left: 2px; }
.profile-chip:hover .del-x,
.profile-chip.active .del-x { opacity: 1; }
.add-chip-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1.5px dashed #d9d9d6;
  background: transparent;
  font-size: 13px;
  color: #aaa;
  cursor: pointer;
  transition: border-color .15s;
}
.add-chip-btn:hover { border-color: #8b7cf8; color: #6c4ef2; }

/* ── 추가 폼 ── */
.add-form { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
.add-form.show { display: flex; }
.add-form input {
  font-size: 13px;
  padding: 5px 10px;
  border: 1px solid #d9d9d6;
  border-radius: 8px;
  outline: none;
  background: #fafafa;
}
.add-form input:focus { border-color: #8b7cf8; }
.add-form .btn-add {
  padding: 5px 14px;
  border-radius: 8px;
  border: none;
  background: #8b7cf8;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}
.add-form .btn-cancel {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid #d9d9d6;
  background: #fff;
  color: #999;
  font-size: 13px;
  cursor: pointer;
}

/* ── 입력 행 ── */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  color: #555;
}
.row input[type="time"] {
  font-size: 15px;
  padding: 6px 10px;
  border: 1px solid #d9d9d6;
  border-radius: 8px;
  background: #fafafa;
  outline: none;
}
.row input[type="number"] {
  font-size: 14px;
  padding: 6px 8px;
  width: 64px;
  border: 1px solid #d9d9d6;
  border-radius: 8px;
  background: #fafafa;
  outline: none;
  text-align: center;
}
.btn-now {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #d9d9d6;
  background: #fff;
  font-size: 12px;
  color: #555;
  cursor: pointer;
  transition: background .12s;
}
.btn-now svg { width: 12px; height: 12px; }
.btn-now:hover { background: #f2f2f0; }

/* ── 메세지 박스 ── */
.message-box {
  background: #fafafa;
  border: 1px solid #e5e5e3;
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #1a1a1a;
  white-space: pre-wrap;
  min-height: 80px; overflow-wrap: break-word;  overflow-wrap: break-word;
  overflow-wrap: break-word;
}
.message-box.placeholder { color: #bbb; }

/* ── 복사 버튼 ── */
.footer { display: flex; align-items: center; gap: 10px; }
.btn-copy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid #d9d9d6;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  transition: background .12s;
}
.btn-copy svg { width: 14px; height: 14px; }
.btn-copy:hover { background: #f2f2f0; }
.copy-done {
  font-size: 12px;
  color: #1a7f4b;
  opacity: 0;
  transition: opacity 0.3s;
}

/* ── 진행 중 칩 ── */
.inprogress-bar {
  background: #fffbf2;
  border: 1.5px solid #fde68a;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.inprogress-label {
  font-size: 12px;
  font-weight: 600;
  color: #b45309;
  white-space: nowrap;
}
.inprogress-empty {
  font-size: 12px;
  color: #ccc;
}
.time-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 16px;
  border: 1.5px solid #fcd34d;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: #92400e;
  cursor: pointer;
  transition: background .12s;
}
.time-chip:hover { background: #ffe0b2; border-color: #f59e0b; }
.time-chip.selected { background: #f59e0b; border-color: #f59e0b; color: #fff; }
.time-chip .chip-x {
  font-size: 11px;
  opacity: 0.5;
  margin-left: 2px;
}
.time-chip:hover .chip-x,
.time-chip.selected .chip-x { opacity: 1; }

/* ── 후속 카드 ── */
.card.followup { border-color: #fee2e2; }
/* ── ZEP 안내 카드 ── */
.card.zep { border-color: #bfdbfe; }
</style>
</head>
<body>
<div class="wrap">

<h1>
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b7cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  불시점검 안내 멘트
  <span id="active-badge" style="font-size:12px;font-weight:400;color:#aaa;"></span>
</h1>

<!-- ── 과정 프로필 ── -->
<div class="card" style="gap:8px;">
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
    <div id="chip-list" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"></div>
    <button class="add-chip-btn" onclick="toggleAddForm()">＋ 추가</button>
  </div>
  <div class="add-form" id="add-form">
    <input type="text" id="new-course" placeholder="과정명" style="width:100px;" />
    <input type="text" id="new-cohort" placeholder="기수" style="width:60px;" />
    <button class="btn-add" onclick="addProfile()">추가</button>
    <button class="btn-cancel" onclick="toggleAddForm()">취소</button>
  </div>
</div>

<!-- ── 초기 멘트 카드 ── -->
<div class="card">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b7cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    불시점검 안내 멘트
  </div>

  <div class="row">
    <label>안내 시점</label>
    <input type="time" id="base-time" oninput="render()" />
    <button class="btn-now" onclick="setNow()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      지금으로
    </button>
  </div>

  <div class="row">
    <label>복귀 시간</label>
    <span style="color:#aaa;">+</span>
    <input type="number" id="offset-min" value="15" min="1" max="60" oninput="render()" />
    <span>분</span>
  </div>

  <div class="message-box" id="message-box"></div>

  <div class="footer">
    <button class="btn-copy" onclick="copyMsg()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      복사하기
    </button>
    <span class="copy-done" id="copy-done">복사됨! 진행 중 목록에 추가됨</span>
  </div>
</div>

<!-- ── ZEP 안내 멘트 카드 ── -->
<div class="card zep">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    ZEP 안내 멘트
  </div>
  <div class="card-sub">최초 자리비움 시각 기준 · ZEP 이탈 후 디스코드 안내 멘트</div>

  <div class="row">
    <label>자리비움 시각</label>
    <input type="time" id="zep-time" oninput="renderZep()" />
    <button class="btn-now" onclick="setZepNow()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      지금으로
    </button>
  </div>

  <div class="message-box placeholder" id="zep-box">자리비움 시각을 입력하면 자동 생성됩니다.</div>

  <div class="footer">
    <button class="btn-copy" onclick="copyZep()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      복사하기
    </button>
    <span class="copy-done" id="zep-copy-done">복사됨!</span>
  </div>
</div>

<!-- ── 후속 조치 카드 ── -->

<div class="inprogress-bar" id="inprogress-bar">
  <span class="inprogress-label">진행 중</span>
  <div id="time-chip-list" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
    <span class="inprogress-empty" id="empty-msg">초기 멘트 복사 시 자동 추가됩니다</span>
  </div>
 </div>
<div class="card followup">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    후속 조치 멘트
  </div>
  <div class="card-sub">칩 클릭 → 최초 자리비움 시각 자동 반영 · 복귀 완료 시 칩 × 클릭</div>

  <div class="row">
    <label>최초 자리비움</label>
    <input type="time" id="first-absence" oninput="renderFollowup()" />
  </div>

  <div class="row">
    <label>후속 시점</label>
    <input type="time" id="followup-time" oninput="renderFollowup()" />
    <button class="btn-now" onclick="setFollowupNow()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      지금으로
    </button>
  </div>

  <div class="message-box placeholder" id="followup-box">최초 자리비움과 후속 시점을 입력하면 자동 생성됩니다.</div>

  <div class="footer">
    <button class="btn-copy" onclick="copyFollowup()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      복사하기
    </button>
    <span class="copy-done" id="followup-copy-done">복사됨!</span>
  </div>
</div>

<script>
function pad(n) { return String(n).padStart(2, '0'); }

/* ─────────────────────────────────────────
ZEP 안내 멘트
───────────────────────────────────────── */
function buildZepMessage() {
const inp = document.getElementById('zep-time').value;
if (!inp) return '';
const [h, m] = inp.split(':').map(Number);
const now = new Date();
const dateStr = (now.getMonth() + 1) + '/' + pad(now.getDate());
const timeStr = h + ':' + pad(m);
return `안녕하세요 00님! ${dateStr}, ${timeStr} 기준으로 수업 참여가 확인되지 않아 디스코드로 안내드렸으니 내용 확인 부탁드립니다🙏\n※ 젭 채팅이력은 출결 증빙자료로 사용할 수 없는 관계로, 복귀 답장은 꼭 디스코드 DM으로 주시기 바랍니다.`;
}

function renderZep() {
const box = document.getElementById('zep-box');
const text = buildZepMessage();
if (text) { box.textContent = text; box.classList.remove('placeholder'); }
else { box.textContent = '자리비움 시각을 입력하면 자동 생성됩니다.'; box.classList.add('placeholder'); }
}

function setZepNow() {
const now = new Date();
document.getElementById('zep-time').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
renderZep();
}

function copyZep() {
const text = buildZepMessage();
if (!text) return;
const ta = document.createElement('textarea');
ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
const el = document.getElementById('zep-copy-done');
el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 1500);
}



/* ─────────────────────────────────────────
   과정 프로필 스위처
───────────────────────────────────────── */
const _mgr = new URLSearchParams(location.search).get('cm') || '';
const PROFILES_KEY = 'announce_profiles_v1' + (_mgr ? '_' + _mgr : '');
const CHIPS_KEY = 'announce_chips_v1' + (_mgr ? '_' + _mgr : '');
let activeIdx = -1;

function getProfiles() {
  try { return JSON.parse(localStorage.getItem(PROFILES_KEY) || '[]'); } catch { return []; }
}
function saveProfiles(arr) { localStorage.setItem(PROFILES_KEY, JSON.stringify(arr)); }

function renderChips() {
  const profiles = getProfiles();
  const list = document.getElementById('chip-list');
  list.innerHTML = profiles.map((p, i) => `
    <button class="profile-chip ${i === activeIdx ? 'active' : ''}" onclick="switchProfile(${i})">
      ${p.label}
      <span class="del-x" onclick="event.stopPropagation(); deleteProfile(${i})">✕</span>
    </button>
  `).join('');
  const badge = document.getElementById('active-badge');
  if (activeIdx >= 0 && profiles[activeIdx]) {
    badge.textContent = '· ' + profiles[activeIdx].label;
    document.title = '불시점검 · ' + profiles[activeIdx].label;
  } else {
    badge.textContent = '';
    document.title = '불시점검 안내 멘트';
  }
}

function switchProfile(i) {
  activeIdx = i;
  try { localStorage.setItem(CHIPS_KEY + '_active', i); } catch {}
  const profiles = getProfiles();
  const key = profiles[i] ? profiles[i].label : null;
  timeChips = key && profileChips[key] ? [...profileChips[key]] : [];
  selectedChipIdx = -1;
  document.getElementById('first-absence').value = '';
  renderFollowup();
  renderChips();
  renderTimeChips();
}

function deleteProfile(i) {
  const p = getProfiles(); p.splice(i, 1); saveProfiles(p);
  if (activeIdx === i) activeIdx = -1;
  else if (activeIdx > i) activeIdx--;
  renderChips();
}

function toggleAddForm() {
  const f = document.getElementById('add-form');
  f.classList.toggle('show');
  if (f.classList.contains('show')) document.getElementById('new-course').focus();
  else { document.getElementById('new-course').value = ''; document.getElementById('new-cohort').value = ''; }
}

function addProfile() {
  const course = document.getElementById('new-course').value.trim();
  const cohort = document.getElementById('new-cohort').value.trim();
  if (!course && !cohort) return;
  const label = `${course}${cohort ? ` ${cohort}기` : ''}`.trim();
  const profiles = getProfiles();
  const existing = profiles.findIndex(p => p.label === label);
  if (existing >= 0) { activeIdx = existing; }
  else { profiles.push({ label, course, cohort }); saveProfiles(profiles); activeIdx = profiles.length - 1; }
  toggleAddForm();
  renderChips();
}

/* ─────────────────────────────────────────
   초기 멘트
───────────────────────────────────────── */
function buildMessage() {
  const inp    = document.getElementById('base-time').value;
  const offset = parseInt(document.getElementById('offset-min').value) || 15;
  if (!inp) return '';
  const [h, m] = inp.split(':').map(Number);
  const now = new Date();
  const dateStr = (now.getMonth() + 1) + '/' + pad(now.getDate());
  const baseStr = h + ':' + pad(m);
  const totalMin = h * 60 + m + offset;
  const retStr = Math.floor(totalMin / 60) % 24 + ':' + pad(totalMin % 60);
  return `안녕하세요 00님, ${dateStr}, ${baseStr} 기준으로 수업 참여가 확인되지 않아 안내드립니다.\n${retStr}까지 복귀하지 않으실 경우, ${baseStr}부터 복귀 시점까지 외출로 반영될 수 있습니다.\n복귀시점은 이 DM에 주시는 답장을 기준으로 계산되니 복귀하셨다면 꼭 답장부탁드립니다. (15분 이하 자리비움은 출결에 영향을 주지 않습니다.)`;
}

function render() { document.getElementById('message-box').textContent = buildMessage(); }

function setNow() {
  const now = new Date();
  document.getElementById('base-time').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  render();
}

function copyMsg() {
  const text = buildMessage();
  if (!text) return;
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);

  // 진행 중 칩 추가
  const time = document.getElementById('base-time').value;
  if (time) addTimeChip(time);

  // ZEP 자리비움 시각 자동 채우기
  const zepInput = document.getElementById('zep-time');
  if (zepInput && time) { zepInput.value = time; renderZep(); }

  const el = document.getElementById('copy-done');
  el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 1800);
}

/* ─────────────────────────────────────────
   진행 중 칩
───────────────────────────────────────── */
let timeChips = []; // [{ time: 'HH:MM' }]
let selectedChipIdx = -1;
let profileChips = (function() { try { return JSON.parse(localStorage.getItem(CHIPS_KEY) || '{}'); } catch { return {}; } })();

function currentProfileLabel() {
  const profiles = getProfiles();
  return activeIdx >= 0 && profiles[activeIdx] ? profiles[activeIdx].label : '__none__';
}

function saveChipsForProfile() {
  profileChips[currentProfileLabel()] = [...timeChips];
  try { localStorage.setItem(CHIPS_KEY, JSON.stringify(profileChips)); } catch {}
}

function addTimeChip(time) {
  if (timeChips.find(c => c.time === time)) return; // 중복 방지
  timeChips.push({ time });
  saveChipsForProfile();
  renderTimeChips();
}

function renderTimeChips() {
  const list = document.getElementById('time-chip-list');
  if (timeChips.length === 0) {
    list.innerHTML = '<span class="inprogress-empty" id="empty-msg">초기 멘트 복사 시 자동 추가됩니다</span>';
    return;
  }
  list.innerHTML = timeChips.map((c, i) => `
    <button class="time-chip ${i === selectedChipIdx ? 'selected' : ''}" onclick="selectTimeChip(${i})">
      ${c.time}
      <span class="chip-x" onclick="event.stopPropagation(); removeTimeChip(${i})">✕</span>
    </button>
  `).join('');
}

function selectTimeChip(i) {
  selectedChipIdx = i;
  document.getElementById('first-absence').value = timeChips[i].time;
  document.getElementById('followup-time').value = '';
  renderTimeChips();
  renderFollowup();
}

function removeTimeChip(i) {
  timeChips.splice(i, 1);
  if (selectedChipIdx === i) { selectedChipIdx = -1; document.getElementById('first-absence').value = ''; renderFollowup(); }
  else if (selectedChipIdx > i) selectedChipIdx--;
  saveChipsForProfile();
  renderTimeChips();
}

/* ─────────────────────────────────────────
   후속 조치 멘트
───────────────────────────────────────── */
function buildFollowupMessage() {
  const first  = document.getElementById('first-absence').value;
  const follow = document.getElementById('followup-time').value;
  if (!first || !follow) return '';

  const [fh, fm] = first.split(':').map(Number);
  const [nh, nm] = follow.split(':').map(Number);
  const now = new Date();
  const dateStr = (now.getMonth() + 1) + '/' + now.getDate();

  return `00님! ${dateStr} ${nh}:${pad(nm)}까지 복귀가 확인되지 않아 최초 자리비움 확인된 ${fh}:${pad(fm)} 부터 복귀시점까지 외출로 처리될 예정입니다.\n복귀시점은 이 DM에 주시는 답장을 기준으로 계산되니 복귀하셨다면 꼭 답장 부탁드립니다`;
}

function renderFollowup() {
  const box  = document.getElementById('followup-box');
  const text = buildFollowupMessage();
  if (text) {
    box.textContent = text;
    box.classList.remove('placeholder');
  } else {
    box.textContent = '최초 자리비움과 후속 시점을 입력하면 자동 생성됩니다.';
    box.classList.add('placeholder');
  }
}

function setFollowupNow() {
  const now = new Date();
  document.getElementById('followup-time').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  renderFollowup();
}

function copyFollowup() {
  const text = buildFollowupMessage();
  if (!text) return;
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  const el = document.getElementById('followup-copy-done');
  el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 1500);
}

/* ─────────────────────────────────────────
   초기화
───────────────────────────────────────── */
document.getElementById('base-time').addEventListener('input', render);
document.getElementById('offset-min').addEventListener('input', render);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('add-form').classList.contains('show')) addProfile();
  if (e.key === 'Escape' && document.getElementById('add-form').classList.contains('show')) toggleAddForm();
});

(function restoreSession() {
  try {
    const saved = localStorage.getItem(CHIPS_KEY + '_active');
    if (saved !== null) {
      const i = parseInt(saved);
      const profiles = getProfiles();
      if (profiles[i]) {
        activeIdx = i;
        const key = profiles[i].label;
        timeChips = profileChips[key] ? [...profileChips[key]] : [];
      }
    }
  } catch {}
})();
renderChips();
renderTimeChips();
setNow();
renderZep();
</script>
</body>
