<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>출결 보고 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: #f7f7f5;
min-height: 100vh;
padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.2rem; }
h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
.card {
background: #fff;
border: 1px solid #e5e5e3;
border-radius: 12px;
padding: 1.25rem 1.4rem;
display: flex;
flex-direction: column;
gap: 10px;
}
.card-title { font-size: 13px; font-weight: 600; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.05em; }
textarea {
width: 100%;
min-height: 120px;
font-size: 12px;
padding: 10px 12px;
border: 1px solid #d9d9d6;
border-radius: 8px;
background: #fafafa;
resize: vertical;
outline: none;
font-family: monospace;
color: #1a1a1a;
transition: border-color 0.15s;
}
textarea:focus { border-color: #8b7cf8; }
.upload-area {
border: 2px dashed #d9d9d6;
border-radius: 8px;
padding: 1.2rem;
text-align: center;
cursor: pointer;
color: #aaa;
font-size: 13px;
transition: border-color 0.15s, background 0.15s;
}
.upload-area:hover { border-color: #8b7cf8; background: #f9f8ff; color: #8b7cf8; }
.upload-area input { display: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
font-size: 13px;
padding: 9px 18px;
border-radius: 8px;
border: 1px solid #d9d9d6;
background: #fff;
color: #1a1a1a;
cursor: pointer;
transition: background 0.12s;
}
.btn:hover { background: #f2f2f0; }
.btn-purple { background: #8b7cf8; color: #fff; border-color: #8b7cf8; }
.btn-purple:hover { background: #7a6be0; }
.btn-sm { font-size: 12px; padding: 6px 12px; }
.settings-row {
display: flex;
gap: 16px;
flex-wrap: wrap;
font-size: 13px;
color: #555;
align-items: flex-start;
}
.settings-row label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.settings-row label.stack { flex-direction: column; align-items: flex-start; gap: 4px; }
.settings-row input[type="time"],
.settings-row input[type="date"],
.settings-row input[type="text"],
.settings-row input[type="number"] {
font-size: 13px;
padding: 4px 8px;
border: 1px solid #d9d9d6;
border-radius: 6px;
background: #fafafa;
outline: none;
}
.divider { height: 1px; background: #e5e5e3; }
.report-tabs { display: flex; gap: 6px; }
.tab {
font-size: 13px;
padding: 7px 16px;
border-radius: 8px 8px 0 0;
border: 1px solid #e5e5e3;
border-bottom: none;
background: #f7f7f5;
color: #999;
cursor: pointer;
}
.tab.active { background: #fff; color: #1a1a1a; font-weight: 600; }
.report-box {
background: #f7f7f5;
border: 1px solid #e5e5e3;
border-radius: 0 10px 10px 10px;
padding: 1rem 1.1rem;
font-size: 13px;
line-height: 1.9;
color: #1a1a1a;
white-space: pre-wrap;
word-break: keep-all;
min-height: 80px;
font-family: inherit;
}
.copy-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.copy-done { font-size: 12px; color: #22a06b; opacity: 0; transition: opacity 0.3s; }
.btn-save-morning { background: #e8f7ef; color: #1a7f4b; border-color: #b2dfc8; }
.btn-save-morning:hover { background: #d0f0e0; }
.btn-save-morning.saved { background: #1a7f4b; color: #fff; border-color: #1a7f4b; }
.save-morning-done { font-size: 12px; color: #1a7f4b; opacity: 0; transition: opacity 0.3s; }
.morning-leave-card { background: #f0faf5; border-color: #b2dfc8; }
.morning-leave-input { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 10px; border: 1px solid #b2dfc8; border-radius: 6px; background: #fff; outline: none; color: #1a1a1a; }
.morning-leave-input:focus { border-color: #1a7f4b; }
.status-bar { font-size: 12px; color: #888; padding: 6px 0; }
.status-bar.ok { color: #22a06b; }
.status-bar.err { color: #e5534b; }
.col-map {
display: none;
flex-direction: column;
gap: 8px;
background: #f7f7f5;
border: 1px solid #e5e5e3;
border-radius: 8px;
padding: 10px 12px;
font-size: 12px;
color: #555;
}
.col-map.show { display: flex; }
.col-map-row { display: flex; align-items: center; gap: 8px; }
.col-map-row label { min-width: 80px; }
.col-map-row input {
width: 60px;
font-size: 12px;
padding: 4px 8px;
border: 1px solid #d9d9d6;
border-radius: 6px;
text-align: center;
background: #fff;
outline: none;
}

/* ── 과정 스위처 ── */
.switcher-bar {
display: flex;
align-items: center;
gap: 6px;
flex-wrap: wrap;
background: #fff;
border: 1px solid #e5e5e3;
border-radius: 12px;
padding: 10px 14px;
}
.switcher-label {
font-size: 12px;
color: #aaa;
white-space: nowrap;
margin-right: 2px;
}
.profile-chip {
display: inline-flex;
align-items: center;
gap: 5px;
font-size: 13px;
padding: 5px 12px;
border-radius: 20px;
border: 1.5px solid #d9d9d6;
background: #fff;
color: #3d3d3d;
cursor: pointer;
transition: all 0.12s;
white-space: nowrap;
}
.profile-chip:hover { border-color: #8b7cf8; color: #6c4ef2; background: #f9f8ff; }
.profile-chip.active { background: #8b7cf8; border-color: #8b7cf8; color: #fff; font-weight: 600; }
.profile-chip .del-x {
font-size: 11px;
opacity: 0.5;
margin-left: 2px;
line-height: 1;
}
.profile-chip:hover .del-x { opacity: 1; }
.profile-chip.active .del-x { opacity: 0.7; }
.add-chip-btn {
display: inline-flex;
align-items: center;
gap: 4px;
font-size: 13px;
padding: 5px 12px;
border-radius: 20px;
border: 1.5px dashed #d9d9d6;
background: transparent;
color: #aaa;
cursor: pointer;
transition: all 0.12s;
white-space: nowrap;
}
.add-chip-btn:hover { border-color: #8b7cf8; color: #6c4ef2; }

/* ── 추가 폼 (인라인) ── */
.add-form {
display: none;
align-items: center;
gap: 6px;
flex-wrap: wrap;
width: 100%;
padding-top: 8px;
border-top: 1px solid #f0f0f0;
margin-top: 4px;
}
.add-form.show { display: flex; }
.add-form input {
font-size: 13px;
padding: 5px 9px;
border: 1px solid #d9d9d6;
border-radius: 8px;
background: #fafafa;
outline: none;
}
.add-form input:focus { border-color: #8b7cf8; }
.add-form input.course-in { width: 70px; }
.add-form input.cohort-in { width: 55px; }
.add-form-hint { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<div class="wrap">

<h1>
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b7cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
출결 보고 생성기
</h1>

<!-- ── 과정 스위처 ── -->
<div class="switcher-bar" id="switcher-bar">
<span class="switcher-label">과정 · 기수</span>
<div id="chip-list" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"></div>
<button class="add-chip-btn" id="add-chip-btn" onclick="toggleAddForm()">＋ 추가</button>
<div class="add-form" id="add-form">
<input type="text" class="course-in" id="new-course" placeholder="예) DA" />
<input type="number" class="cohort-in" id="new-cohort" placeholder="15" min="1" />
<span style="font-size:13px;color:#555;">기</span>
<button class="btn btn-sm btn-purple" onclick="addProfile()">저장</button>
<button class="btn btn-sm" onclick="toggleAddForm()">취소</button>
</div>
</div>

<!-- 기준 설정 -->
<div class="card">
<div class="card-title">기준 설정</div>
<input type="hidden" id="course-name" />
<input type="hidden" id="course-gen" />
<div class="settings-row">
<label>날짜 <input type="date" id="report-date" /></label>
<label>지각 기준 <input type="time" id="late-threshold" value="09:11" /></label>
<label>조퇴 기준 <input type="time" id="early-leave-threshold" value="18:50" /></label>
</div>
<div class="divider"></div>
<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">
<div class="settings-row" style="flex-direction:column;flex:1;min-width:180px;gap:6px;">
<span style="font-weight:600;font-size:13px;color:#555;">오전 보고 휴공가</span>
<span style="font-size:11px;color:#aaa;margin-top:-4px;">(오전 분석 후 저장 버튼 클릭)</span>
<input type="text" class="morning-leave-input" id="morning-leave-input" placeholder="자동 저장 또는 직접 입력" style="width:100%;" />
<div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
<button class="btn btn-sm btn-save-morning" id="save-morning-btn" onclick="saveMorningLeave()">오전 휴공가 저장</button>
<span class="save-morning-done" id="save-morning-done">저장됨 ✓</span>
</div>
</div>
<div class="settings-row" style="flex-direction:column;flex:1;min-width:180px;gap:6px;">
<span style="font-weight:600;font-size:13px;color:#555;">출석입력요청 검토 결과</span>
<label style="gap:6px;">검토 대상 <input type="number" id="review-count" value="0" style="width:55px;" min="0" /></label>
<label style="gap:6px;">검토 결과 <input type="text" id="review-result" placeholder="예) 승인 3, 반려 1" style="flex:1;" /></label>
</div>
</div>
</div>

<!-- 데이터 입력 -->
<div class="card">
<div class="card-title">데이터 입력</div>
<div class="upload-area" onclick="document.getElementById('file-input').click()" id="upload-area">
<input type="file" id="file-input" accept=".xlsx,.xls" onchange="handleFile(event)" />
<div class="upload-icon">📊</div>
<div>엑셀 파일을 클릭하여 업로드</div>
<div style="font-size:12px;color:#aaa;margin-top:4px;">.xlsx / .xls 지원</div>
</div>
<div id="col-map-toggle" style="display:none;margin-top:12px;">
<button class="btn btn-sm" onclick="toggleColMap()" style="font-size:12px;">⚙ 열 매핑 확인/수정</button>
</div>
<div class="col-map-panel" id="col-map-panel">
<div class="col-map-title">열 매핑 설정 <span style="font-weight:400;font-size:11px;color:#aaa;">(0부터 시작하는 열 번호)</span></div>
<div class="col-map-grid">
<label>이름 열<input type="number" id="col-name" value="1" min="0"/></label>
<label>입장 열<input type="number" id="col-enter" value="3" min="0"/></label>
<label>퇴장 열<input type="number" id="col-exit" value="4" min="0"/></label>
</div>
</div>
<div class="data-status" id="data-status"></div>
<div id="paste-wrap" style="display:none">
<textarea id="paste-area" rows="6" placeholder="또는 여기에 텍스트 데이터 붙여넣기"></textarea>
</div>
<div class="btn-row">
<button class="btn btn-purple" id="analyze-btn" onclick="analyze()">분석하기</button>
<button class="btn" onclick="clearAll()">초기화</button>
</div>
<div class="status-bar" id="status-bar"></div>
</div>
<!-- 리포트 출력 -->
<div class="card" id="report-card" style="display:none">
<div class="tab-row">
<button class="tab-btn active" id="tab-morning" onclick="switchTab('morning')">오전</button>
<button class="tab-btn" id="tab-afternoon" onclick="switchTab('afternoon')">오후</button>
<button class="tab-btn" id="tab-final" onclick="switchTab('final')">최종</button>
</div>
<div class="report-box" id="report-text"></div>
<div class="btn-row" style="margin-top:12px;">
<button class="btn btn-purple" onclick="copyReport()">복사</button>
</div>
</div>

<script>
const XLSX_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
let xlsxReady = false;
let xlsxPending = null;
function loadXlsx(cb){
  if(xlsxReady){cb();return;}
  if(xlsxPending){xlsxPending.push(cb);return;}
  xlsxPending=[cb];
  const s=document.createElement('script');
  s.src=XLSX_CDN;
  s.onload=()=>{xlsxReady=true;xlsxPending.forEach(f=>f());xlsxPending=null;};
  document.head.appendChild(s);
}

let profiles=[];
let activeProfile=0;
let activeTab='morning';
let reports={morning:'',afternoon:'',final:''};
let morningLeaveNames=[];

function saveProfiles(){
  try{localStorage.setItem('cm_profiles',JSON.stringify(profiles));}catch(e){}
}
function loadProfiles(){
  try{
    const d=localStorage.getItem('cm_profiles');
    if(d)profiles=JSON.parse(d);
  }catch(e){}
}
function renderChips(){
  const wrap=document.getElementById('chips-wrap');
  if(!wrap)return;
  wrap.innerHTML='';
  profiles.forEach((p,i)=>{
    const chip=document.createElement('div');
    chip.className='chip'+(i===activeProfile?' active':'');
    chip.textContent=p.course+'\xa0'+p.cohort+'기';
    chip.onclick=()=>{activeProfile=i;renderChips();
      document.getElementById('course-name').value=p.course;
      document.getElementById('course-gen').value=p.cohort;
    };
    const del=document.createElement('span');
    del.className='chip-del';
    del.textContent='×';
    del.onclick=(e)=>{e.stopPropagation();profiles.splice(i,1);if(activeProfile>=profiles.length)activeProfile=Math.max(0,profiles.length-1);saveProfiles();renderChips();};
    chip.appendChild(del);
    wrap.appendChild(chip);
  });
  if(profiles[activeProfile]){
    document.getElementById('course-name').value=profiles[activeProfile].course;
    document.getElementById('course-gen').value=profiles[activeProfile].cohort;
  }
}
function toggleAddForm(){
  const f=document.getElementById('add-form');
  f.style.display=f.style.display==='flex'?'none':'flex';
}
function addProfile(){
  const c=(document.getElementById('new-course').value||'').trim();
  const g=parseInt(document.getElementById('new-cohort').value)||0;
  if(!c||!g){alert('과정명과 기수를 입력해주세요.');return;}
  profiles.push({course:c,cohort:g});
  activeProfile=profiles.length-1;
  saveProfiles();renderChips();
  document.getElementById('add-form').style.display='none';
  document.getElementById('new-course').value='';
  document.getElementById('new-cohort').value='';
}
function init(){
  loadProfiles();
  if(!profiles.length)profiles=[{course:'DA',cohort:15}];
  renderChips();
  const rd=document.getElementById('report-date');
  if(rd)rd.valueAsDate=new Date();
}
window.addEventListener('DOMContentLoaded',init);

function handleFile(e){
  const file=e.target.files[0];
  if(!file)return;
  loadXlsx(()=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        window._rawRows=raw;
        const detected=autoDetectCols(raw);
        document.getElementById('col-name').value=detected.name;
        document.getElementById('col-enter').value=detected.enter;
        document.getElementById('col-exit').value=detected.exit;
        document.getElementById('col-map-toggle').style.display='block';
        const ds=document.getElementById('data-status');
        ds.textContent='✅ '+file.name+' 로드 완료 ('+( raw.length-1)+'행)';
        ds.style.color='#4caf50';
        setStatus('파일 로드 완료. 분석하기를 눌러주세요.','info');
      }catch(err){
        setStatus('파일 읽기 오류: '+err.message,'error');
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseRows(){
  if(window._rawRows){
    const colName=parseInt(document.getElementById('col-name').value)||1;
    const colEnter=parseInt(document.getElementById('col-enter').value)||3;
    const colExit=parseInt(document.getElementById('col-exit').value)||4;
    return window._rawRows.slice(1).map(r=>({
      name:String(r[colName]||'').trim(),
      enter:String(r[colEnter]||'').trim(),
      exit:String(r[colExit]||'').trim()
    })).filter(r=>r.name);
  }
  const txt=document.getElementById('paste-area').value.trim();
  if(!txt)return[];
  return txt.split('\n').map(l=>{
    const p=l.split(/\t|,/);
    return{name:(p[1]||'').trim(),enter:(p[3]||'').trim(),exit:(p[4]||'').trim()};
  }).filter(r=>r.name);
}

function autoDetectCols(rows){
  const hdr=(rows[0]||[]).map(c=>String(c).toLowerCase());
  let name=1,enter=3,exit=4;
  hdr.forEach((cell,i)=>{
    if(/이름|성명|name/.test(cell))name=i;
    else if(/입장|입실|접속|enter|login/.test(cell))enter=i;
    else if(/퇴장|퇴실|exit|logout/.test(cell))exit=i;
  });
  return{name,enter,exit};
}

function parseTime(s){
  if(!s)return null;
  const m=s.match(/(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return{h:parseInt(m[1]),m:parseInt(m[2]),str:m[0]};
}
function timeToMin(t){return t?t.h*60+t.m:null;}
function fmtTime(t){if(!t)return'';return String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0');}

function analyze(){
  const rows=parseRows();
  if(!rows.length){setStatus('데이터가 없습니다. 파일을 업로드하거나 텍스트를 붙여넣어주세요.','error');return;}
  const course=document.getElementById('course-name').value.trim();
  const gen=document.getElementById('course-gen').value.trim();
  if(!course||!gen){setStatus('과정명과 기수를 선택해주세요.','error');return;}
  const dateEl=document.getElementById('report-date');
  const dateVal=dateEl.value;
  let dateStr='';
  if(dateVal){
    const d=new Date(dateVal);
    const days=['일','월','화','수','목','금','토'];
    dateStr=' '+( d.getMonth()+1)+'월'+(d.getDate())+'일('+days[d.getDay()]+')';
  }
  const lateThresh=document.getElementById('late-threshold').value||'09:11';
  const earlyThresh=document.getElementById('early-leave-threshold').value||'18:50';
  const [lh,lm]=lateThresh.split(':').map(Number);
  const lateMin=lh*60+lm;
  const [eh,em]=earlyThresh.split(':').map(Number);
  const earlyMin=timeToMin({h:eh,m:em});

  let absentList=[],lateList=[],earlyLeaveList=[],outing=[],presentCount=0,leaveList=[];
  const nameMap={};
  rows.forEach(r=>{
    if(!r.name)return;
    if(!nameMap[r.name])nameMap[r.name]={enters:[],exits:[]};
    const en=parseTime(r.enter);
    const ex=parseTime(r.exit);
    if(en)nameMap[r.name].enters.push(en);
    if(ex)nameMap[r.name].exits.push(ex);
  });
  Object.entries(nameMap).forEach(([name,{enters,exits}])=>{
    if(!enters.length){absentList.push(name);return;}
    presentCount++;
    enters.sort((a,b)=>timeToMin(a)-timeToMin(b));
    exits.sort((a,b)=>timeToMin(a)-timeToMin(b));
    const firstEn=enters[0];
    const lastEx=exits[exits.length-1];
    if(timeToMin(firstEn)>lateMin)lateList.push({name,time:fmtTime(firstEn)});
    let outStartMin=null,outStartStr=null;
    for(let i=0;i<exits.length;i++){
      const exMin=timeToMin(exits[i]);
      const nextEnMin=enters[i+1]?timeToMin(enters[i+1]):null;
      if(nextEnMin!==null&&nextEnMin-exMin>=1){
        outStartMin=exMin;outStartStr=fmtTime(exits[i]);
      }
    }
    if(outStartMin!==null)outing.push({name,startTime:outStartStr,endTime:lastEx?fmtTime(lastEx):null});
    const lastExMin=timeToMin(lastEx);
    if(lastExMin!==null&&lastExMin<earlyMin){
      const isOut=outing.some(o=>o.name===name);
      if(!isOut)earlyLeaveList.push({name,time:fmtTime(lastEx)});
    }
  });
  const reviewCount=parseInt(document.getElementById('review-count').value)||0;
  const reviewResult=document.getElementById('review-result').value.trim();
  const courseLabel='['+course+' '+gen+'기] ';
  const totalCount=Object.keys(nameMap).length;
  leaveList=[...absentList.map(n=>n+'(결석)')];
  lateList.forEach(({name,time})=>leaveList.push(name+'(지각 '+time+')'));
  earlyLeaveList.forEach(({name,time})=>leaveList.push(name+'(조퇴 '+time+')'));
  window._lastLeaveList=[...leaveList];

  window._analyzeContext={
    leaveList:[...leaveList],
    outing:[...outing],
    presentCount,
    courseLabel,
    dateStr,
    reviewCount,
    reviewResult
  };

  const mlInput=document.getElementById('morning-leave-input');
  if(mlInput&&!mlInput.value){
    mlInput.value=leaveList.map(item=>item.split('(')[0]).join(', ');
  }

  let morning=courseLabel+dateStr+' 오전 출결 현황 공유\n';
  morning+='• ZEP 접속자: '+presentCount+'명\n';
  morning+='• 지각: '+lateList.length+'명';
  if(lateList.length>0)lateList.forEach(({name,time})=>{morning+='\n  ◦ '+name+': '+time+' 접속';});
  morning+='\n• 외출: '+outing.length+'명';
  if(outing.length>0)outing.forEach(({name,startTime,endTime})=>{morning+='\n  ◦ '+name+': '+startTime+'~'+(endTime||'미복귀')+' 외출';});
  morning+='\n• 휴공가: '+leaveList.length+'명';
  if(leaveList.length>0)leaveList.forEach(i=>{morning+='\n  ◦ '+i;});
  if(reviewCount>0){morning+='\n• 출석입력요청 검토: '+reviewCount+'건';if(reviewResult)morning+=' ('+reviewResult+')';}
  reports.morning=morning;

  const addLeave=morningLeaveNames.length>0
    ?leaveList.filter(item=>!morningLeaveNames.includes(item.split('(')[0]))
    :leaveList;
  let aft=courseLabel+dateStr+' 오후 출결 현황 공유\n';
  aft+='• ZEP 접속자: '+presentCount+'명\n';
  aft+='• 외출: '+outing.length+'명';
  if(outing.length>0)outing.forEach(({name,startTime,endTime})=>{aft+='\n  ◦ '+name+': '+startTime+'~'+(endTime||'미복귀')+' 외출';});
  aft+='\n• 추가 휴공가: '+addLeave.length+'명';if(addLeave.length>0)addLeave.forEach(i=>{aft+='\n  ◦ '+i;});
  reports.afternoon=aft;

  let fin=courseLabel+dateStr+' 출결 현황 공유\n';
  fin+='• 출석: '+presentCount+'/'+totalCount+'명\n';
  fin+='• 지각/외출/조퇴: '+(lateList.length+outing.length+earlyLeaveList.length)+'명\n';
  fin+='• 휴공가: '+leaveList.length+'명';
  if(leaveList.length>0)leaveList.forEach(i=>{fin+='\n  ◦ '+i;});
  if(reviewCount>0){fin+='\n• 출석입력요청 검토: '+reviewCount+'건';if(reviewResult)fin+=' ('+reviewResult+')';}
  reports.final=fin;

  document.getElementById('report-card').style.display='block';
  switchTab('morning');
  setStatus('분석 완료!','success');
}

function switchTab(tab){
  activeTab=tab;
  ['morning','afternoon','final'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  document.getElementById('report-text').textContent=reports[tab]||'';
}

function saveMorningLeave(){
  const mlInputEl=document.getElementById('morning-leave-input');
  morningLeaveNames=(mlInputEl?mlInputEl.value:'').split(',').map(s=>s.trim()).filter(Boolean);
  const ctx=window._analyzeContext;
  if(ctx){
    const addLeave=morningLeaveNames.length>0
      ?ctx.leaveList.filter(item=>!morningLeaveNames.includes(item.split('(')[0]))
      :ctx.leaveList;
    let aft=ctx.courseLabel+ctx.dateStr+' 오후 출결 현황 공유\n';
    aft+='• ZEP 접속자: '+ctx.presentCount+'명\n';
    aft+='• 외출: '+ctx.outing.length+'명';
    if(ctx.outing.length>0)ctx.outing.forEach(({name,startTime,endTime})=>{aft+='\n  ◦ '+name+': '+startTime+'~'+(endTime||'미복귀')+' 외출';});
    aft+='\n• 추가 휴공가: '+addLeave.length+'명';if(addLeave.length>0)addLeave.forEach(i=>{aft+='\n  ◦ '+i;});
    reports.afternoon=aft;
    if(activeTab==='afternoon')document.getElementById('report-text').textContent=aft;
  }
  const btn=document.getElementById('save-morning-btn');
  if(btn)btn.classList.add('saved');
  const el=document.getElementById('save-morning-done');
  if(el){el.style.opacity='1';setTimeout(()=>el.style.opacity='0',1800);}
}

function textToHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function copyReport(){
  const txt=reports[activeTab]||'';
  if(!txt)return;
  navigator.clipboard.writeText(txt).then(()=>setStatus('복사됨!','success')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=txt;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    setStatus('복사됨!','success');
  });
}

function toggleColMap(){
  const p=document.getElementById('col-map-panel');
  p.style.display=p.style.display==='block'?'none':'block';
}

function clearData(){
  document.getElementById('paste-area').value='';
  document.getElementById('file-input').value='';
  document.getElementById('report-card').style.display='none';
  setStatus('');
  reports={morning:'',afternoon:'',final:''};
  window._lastLeaveList=[];
}

function clearAll(){
  clearData();
  morningLeaveNames=[];
  window._lastLeaveList=[];
  window._analyzeContext=null;
  const mlI=document.getElementById('morning-leave-input');if(mlI)mlI.value='';
  const mlB=document.getElementById('save-morning-btn');if(mlB)mlB.classList.remove('saved');
}

function setStatus(msg,type=''){
  const el=document.getElementById('status-bar');
  el.textContent=msg;
  el.className='status-bar'+(type?' '+type:'');
}
</script>
</body>
</html>
